name: Build and publish Tempest image
on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths: ['service/**', 'papers/web/pressure.js', 'papers/web/relationship-multipliers.json', 'papers/personality-mapping/**', 'papers/personality_state_mapping.py', 'papers/personality_synthesis.py', 'papers/emotion_training/**', '.github/workflows/publish.yml']
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hominemai/tempest
jobs:
  build-and-push:
    runs-on:
      group: smg-private
      labels: [self-hosted, linux, x64, smg-k8s]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tempest
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: tempest_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tempest -d tempest_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test service
        run: python -m unittest discover -s service -p 'test_*.py' -v
      - name: Test PostgreSQL backend
        env:
          DATABASE_URL: postgresql://tempest:test-only@localhost:5432/tempest_test
          TEMPEST_REQUIRE_POSTGRES: 'true'
        run: |
          pip install 'psycopg[binary]>=3.2,<4'
          python -m unittest discover -s service -p 'test_*.py' -v
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
