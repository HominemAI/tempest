for(const [key,title] of filterFields){const label=element('label',title),select=document.createElement('select');select.id='filter-'+key;label.htmlFor=select.id;select.append(new Option('All '+title.toLowerCase()+'s',''));const values=[...new Set((['labels','field','type'].includes(key)?DATA.documents:rows).flatMap(r=>Array.isArray(r[key])?r[key]:[r[key]]))].filter(Boolean).sort();for(const value of values)select.append(new Option(value,value));select.addEventListener('change',()=>{page=0;render()});label.append(select);$('filters').append(label);controls.set(key,select);}

let boldInitials=false;

const commentLabel=element('label','Comment (optional)'),commentInput=element('textarea');commentInput.id='highlightComment';commentInput.rows=2;commentInput.placeholder='Add a note about this passage…';commentLabel.htmlFor='highlightComment';commentLabel.append(commentInput);selectionTools.insertBefore(commentLabel,selectionActions);const dismissSelection=element('button','Close');dismissSelection.id='dismissSelection';dismissSelection.onclick=()=>{selectionTools.hidden=true;editingAnnotationId=null;};selectionActions.append(dismissSelection);
const transferControls=element('details'),transferSummary=element('summary','Notes backup / transfer');transferControls.append(transferSummary);transferControls.style.fontSize='11px';document.querySelector('.viewerhead').append(transferControls);const exportNotes=element('button','Export notes'),importNotes=element('button','Import notes'),importFile=element('input');importFile.type='file';importFile.accept='.json,application/json';importFile.hidden=true;transferControls.append(exportNotes,importNotes,importFile);
exportNotes.onclick=async()=>{try{await annotationsReady;const blob=new Blob([JSON.stringify({version:1,annotations:readAnnotations()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=element('a');link.href=url;link.download='research-notes.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(error){annotationStatus.textContent=error.message;}};importNotes.onclick=()=>importFile.click();importFile.onchange=async()=>{let saved=0;try{const file=importFile.files[0];if(!file)return;if(file.size>10_000_000)throw Error('Notes file must be smaller than 10 MB');const data=JSON.parse(await file.text()),notes=data.annotations||data;if(!Array.isArray(notes))throw Error('Expected an annotations array');for(const note of notes){await persistAnnotation({...note,comment:note.comment||''});saved++;}restoreHighlights();annotationStatus.textContent=`Imported ${saved} notes${serverAnnotations?' into SQLite':' into this browser'}`;}catch(error){annotationStatus.textContent=`Imported ${saved} notes; stopped: ${error.message}`;}finally{importFile.value='';}};
function positionSelectionTools(rect){const dialog=$('viewer').getBoundingClientRect();selectionTools.style.left=Math.max(dialog.left+8,Math.min(rect.left,dialog.right-selectionTools.offsetWidth-8))+'px';selectionTools.style.top=Math.max(dialog.top+8,Math.min(rect.bottom+8,dialog.bottom-selectionTools.offsetHeight-8))+'px';}
